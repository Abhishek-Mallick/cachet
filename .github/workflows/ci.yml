name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"

jobs:
  hygiene:
    name: fmt · vet · lint · tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # Asserts that running `go mod tidy` changes nothing, rather than that the working tree
      # matches HEAD — the latter also fails on any legitimate uncommitted dependency change.
      - name: go mod tidy is a no-op
        run: make tidy
      # install-only: the action installs golangci-lint and nothing else, and `make lint` runs it.
      # CI therefore executes the EXACT command a developer runs locally, including the build tags.
      # When the action owned the invocation, its args and the Makefile's could drift apart, and the
      # first anyone would know is a lint failure that does not reproduce on a laptop.
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2, install-only: true }
      - name: vet + lint
        run: make lint
      # `golangci-lint fmt` has no --diff mode, so formatting is checked by running it and asserting
      # nothing changed. Ordering matters: this must come after linting, since fmt rewrites files.
      - name: formatting is clean
        run: |
          golangci-lint fmt ./...
          git diff --exit-code

  unit:
    name: unit · race · leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # -count=2 is deliberate: it catches tests that only pass because of
      # state left behind by their first run. Build plan §7.2.
      - run: go test -race -count=2 ./...

  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}" }
        run: make build

  integration:
    name: integration · testcontainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make test-integration

  env-budget:
    name: env-up under 90s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # The 90-second budget is the top of the adoption funnel (build plan §6.1).
      # If it drifts, adoption drops and nobody notices. So it is a CI failure.
      - name: make env-up
        run: |
          start=$(date +%s)
          make env-up
          elapsed=$(( $(date +%s) - start ))
          echo "env-up took ${elapsed}s"
          if [ "$elapsed" -gt 90 ]; then
            echo "::error::env-up took ${elapsed}s, budget is 90s (build plan §9.2)"
            exit 1
          fi
      - if: always()
        run: make env-down

  # The two suites the entire pitch rests on. Until 2026-09-19 neither ran here, and CONSISTENCY.md
  # and FAULTS.md were held true by whoever remembered to run them. A suite that runs only when
  # somebody remembers is a suite that will eventually be wrong with nobody noticing — and the
  # failure mode is silent, which is the kind this project exists to eliminate.
  #
  # They need the compose stack rather than testcontainers, which is why they are separate jobs: the
  # stack takes time to come up and there is no reason to pay for it twice in one job.
  consistency:
    name: conformance matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make env-up
      # Includes the cells that are REQUIRED to fail against a deliberately naive cache. A
      # consistency suite that has never failed is proving nothing.
      - run: make test-consistency
      - if: always()
        run: make env-down

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make env-up
      - run: make test-e2e
      - if: always()
        run: make env-down

  chaos:
    name: injected faults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make env-chaos-up
      - run: make test-chaos

      # FAULTS.md is generated from what the suite observed, so regenerating it here is what stops
      # the document drifting from the suite that produced it.
      #
      # Asserted structurally rather than byte-for-byte. Entries carry the evidence each injection
      # fired — breaker counts, error totals — and those legitimately differ between runs. A diff
      # check would fail on a healthy run, which trains people to ignore it. What must not change is
      # the COVERAGE: every fault in the catalogue still recorded, by a suite that just passed.
      - name: FAULTS.md still covers every fault
        run: |
          set -euo pipefail
          make faults
          if ! grep -q '^\*\*Coverage: 9 of 9\.\*\*$' FAULTS.md; then
            echo "::error::FAULTS.md does not report full coverage after a passing chaos run."
            grep -n 'Coverage:' FAULTS.md || true
            exit 1
          fi
          for n in 1 2 3 4 5 6 7 8 9; do
            grep -q "^| $n | ✅ " FAULTS.md || {
              echo "::error::fault $n has no entry in FAULTS.md"; exit 1; }
          done
          echo "FAULTS.md covers all 9 faults"

      # The generated document is committed, so a regeneration that changes its STRUCTURE — a new
      # fault, a renamed one — has to be committed too. Evidence-only churn is expected and ignored.
      - name: the document's structure is committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- FAULTS.md; then
            if git diff -U0 -- FAULTS.md | grep -E '^[+-]\| [0-9]+ \|' | grep -qv 'failing\|shedding\|= [0-9]'; then
              echo "::error::FAULTS.md structure changed. Run 'make test-chaos && make faults' and commit."
              git --no-pager diff -- FAULTS.md
              exit 1
            fi
            echo "only per-run evidence changed; nothing to commit"
          fi
      - if: always()
        run: make env-down

  # The documentation site. It had nine pages and nothing compiled it, so the first person to learn
  # it was broken would have been a reader.
  docs-site:
    name: docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make vuln
