apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cachet.fullname" . }}
  labels:
    {{- include "cachet.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Generated by the Helm chart. Credentials are NOT here: they come from a Secret, because a
    # ConfigMap is readable by anything that can list them and shows up in `helm get values`.
    #
    # The DSN names the environment variables the Deployment mounts from that Secret. Cachet expands
    # ${VAR} in a DSN at load and refuses to start if one is unset — so a missing Secret key is a
    # boot failure naming the variable, rather than an authentication error against the database
    # twenty seconds later with nothing in it pointing here.
    shards:
    {{- range .Values.shards }}
      - id: {{ .id }}
        dsn: "${CACHET_DB_USERNAME}:${CACHET_DB_PASSWORD}@tcp({{ .host }}:{{ .port | default 3306 }})/{{ .database }}{{ with .params }}?{{ . }}{{ end }}"
    {{- end }}
    topologies:
    {{- range .Values.topologies }}
      - name: {{ .name }}
        shards: [{{ join ", " .shards }}]
    {{- end }}
    tables:
    {{- range .Values.tables }}
      - name: {{ .name }}
        topology: {{ .topology }}
        primary_key: [{{ join ", " .primary_key }}]
        version_column: {{ .version_column }}
        columns:
        {{- range .columns }}
          - {name: {{ .name }}, type: {{ .type }}{{ if .nullable }}, nullable: true{{ end }}{{ if .collation }}, collation: {{ .collation }}{{ end }}}
        {{- end }}
        {{- with .predicates }}
        predicates:
        {{- range . }}
          - match: [{{ join ", " .match }}]
            set: [{{ join ", " .set }}]
        {{- end }}
        {{- end }}
    {{- end }}
    cache:
      addresses:
      {{- range .Values.cache.addresses }}
        - {{ . }}
      {{- end }}
      ttl: {{ .Values.cache.ttl }}
    consistency:
      default_level: {{ .Values.consistency.defaultLevel }}
      max_clock_skew: {{ .Values.consistency.maxClockSkew }}
