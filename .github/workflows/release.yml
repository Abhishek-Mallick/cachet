name: release

# Tag-triggered. Everything a stranger needs to install Cachet without cloning this repository:
# signed binaries with checksums, a Homebrew cask, and multi-arch images published BY DIGEST.
#
# Digests rather than floating tags, because "cachet:v1" is a promise about a name and a digest is a
# statement about bytes. An operator who pins a digest gets the image that was tested.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  REGISTRY: ghcr.io

jobs:
  # The gate runs first and the release depends on it. A tag is not a licence to skip the tests:
  # an unverified release is worse than no release, because it is the one people install.
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: make lint
      - run: make test-unit

  binaries:
    name: signed binaries · homebrew
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      id-token: write   # keyless signing against this workflow's OIDC identity
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # goreleaser builds the changelog from history
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --skip=publish,sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A separate token: publishing to the tap repository is a different permission from
          # publishing here, and GITHUB_TOKEN cannot reach another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  images:
    name: images · ${{ matrix.binary }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        # cachetctl is included so the demo can run entirely from images, without a Go toolchain.
        binary: [cachet, flux, sextant, cachetctl]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.binary }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign the image by digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.binary }}
        # Signing the digest, never a tag. A tag can be moved after signing; a digest cannot.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: publish the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### \`${{ matrix.binary }}\`"
            echo
            echo '```'
            echo "${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.binary }}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      # Rendered before it is published. A chart that does not template is a chart nobody can
      # install, and finding that out from a user is worse than finding it out here.
      - name: render both topologies
        run: |
          set -euo pipefail
          helm lint deploy/helm/cachet
          helm template rel deploy/helm/cachet > /dev/null
          helm template rel deploy/helm/cachet --set topology=service --set sextant.enabled=true > /dev/null

      - name: package and push
        if: github.event_name == 'push'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package deploy/helm/cachet --version "$v" --app-version "$v"
          helm push "cachet-${v}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
