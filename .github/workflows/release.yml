name: release

# Tag-triggered. Everything a stranger needs to install Cachet without cloning this repository:
# signed binaries with checksums, a Homebrew cask, and multi-arch images published BY DIGEST.
#
# Digests rather than floating tags, because "cachet:v1" is a promise about a name and a digest is a
# statement about bytes. An operator who pins a digest gets the image that was tested.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  REGISTRY: ghcr.io

jobs:
  # The gate runs first and the release depends on it. A tag is not a licence to skip the tests:
  # an unverified release is worse than no release, because it is the one people install.
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # `make lint` runs golangci-lint, which the runner does not have. Pinned to the same version
      # ci.yml uses: a release gate that lints differently from the branch gate is not a gate.
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2, install-only: true }
      - run: make lint
      - run: make test-unit

  binaries:
    name: signed binaries · homebrew
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      id-token: write   # keyless signing against this workflow's OIDC identity
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # goreleaser builds the changelog from history
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # The Homebrew cask publishes into a SEPARATE repository, which GITHUB_TOKEN cannot reach, so
      # it needs its own token. Everything else — the GitHub release, the binaries, the checksums,
      # the signatures — needs nothing but this workflow. Missing the token must therefore skip the
      # cask, not fail the release.
      - id: tap
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "skip=" >> "$GITHUB_OUTPUT"
            echo "The Homebrew cask will be published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=--skip=homebrew" >> "$GITHUB_OUTPUT"
            {
              echo "### Homebrew cask skipped"
              echo
              echo 'No `HOMEBREW_TAP_TOKEN` is configured, so the cask was not published.'
              echo 'The release, binaries, checksums and signatures are unaffected.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: >-
            release --clean ${{ steps.tap.outputs.skip }}
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --skip=publish,sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  images:
    name: images · ${{ matrix.binary }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        # cachetctl is included so the demo can run entirely from images, without a Go toolchain.
        binary: [cachet, cachet-proxy, flux, sextant, cachetctl]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.binary }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY=${{ matrix.binary }}
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign the image by digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
          BINARY: ${{ matrix.binary }}
        # Signing the digest, never a tag. A tag can be moved after signing; a digest cannot.
        #
        # Lowercased: an image reference must be, and a GitHub owner need not be. The push itself
        # never hit this because docker/metadata-action lowercases for you — so the image published
        # and only the signature failed, which is the worst half to lose.
        run: |
          image=$(echo "${{ env.REGISTRY }}/${REPO}/${BINARY}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${image}@${DIGEST}"

      - name: publish the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ${{ github.repository }}
          BINARY: ${{ matrix.binary }}
        run: |
          image=$(echo "${{ env.REGISTRY }}/${REPO}/${BINARY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "### \`${BINARY}\`"
            echo
            echo '```'
            echo "${image}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      # Rendered before it is published. A chart that does not template is a chart nobody can
      # install, and finding that out from a user is worse than finding it out here.
      - name: render both topologies
        run: |
          set -euo pipefail
          helm lint deploy/helm/cachet
          helm template rel deploy/helm/cachet > /dev/null
          helm template rel deploy/helm/cachet --set topology=service --set sextant.enabled=true > /dev/null

      - name: package and push
        if: github.event_name == 'push'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          # OCI repository names must be lowercase, and a GitHub owner need not be. The images job
          # never hit this because docker/metadata-action lowercases for you; helm does not, and
          # says only `invalid reference: invalid repository`, which names the value and not the
          # rule it broke.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package deploy/helm/cachet --version "$v" --app-version "$v"
          helm push "cachet-${v}.tgz" "oci://ghcr.io/${owner}/charts"
