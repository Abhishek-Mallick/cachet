name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest thing that shows it. `make env-up` plus a few commands is ideal.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: "`cachetctl version`, or the image digest."
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and architecture, MySQL/Percona version, Valkey or Redis version, deployment shape (sidecar or service tier).
