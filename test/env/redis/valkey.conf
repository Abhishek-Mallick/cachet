# Valkey configuration for the Cachet test environment.
# Deliberately NOT a production template — it is tuned to make cache behaviour observable and
# reproducible, which is not the same as tuned for throughput.

bind 0.0.0.0
protected-mode no
port 6379

# No persistence. The cache is never the source of truth (product spec §9), and a restart losing
# every entry is a correctness non-event by design — test/e2e exercises exactly that.
save ""
appendonly no

# Bounded memory with an LRU policy, so eviction pressure is a thing the tests can actually create.
# Entry loss must never be a correctness event; allkeys-lru makes that assertion meaningful.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Cachet caches rows via Lua scripts held in the script cache. Keep them.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# Latency visibility for the benchmark harness.
latency-monitor-threshold 100
slowlog-log-slower-than 1000
slowlog-max-len 1024
